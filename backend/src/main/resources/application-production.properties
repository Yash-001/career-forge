# ── Production Profile ────────────────────────────────────────────────────────
# Activated by: SPRING_PROFILES_ACTIVE=production
# Contains only production-specific overrides. All other config inherits from
# application.properties.

# ── Datasource (Supabase — SSL required) ──────────────────────────────────────
# DATABASE_URL must include ?sslmode=require, e.g.:
#   jdbc:postgresql://<host>:5432/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
