spring.application.name=careerforge-backend
server.port=8080

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/careerforge}
spring.datasource.username=${DATABASE_USERNAME:careerforge}
spring.datasource.password=${DATABASE_PASSWORD:careerforge}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-must-be-at-least-256-bits-long!!}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# ── Email Provider ────────────────────────────────────────────────────────────
# Supported values: console (default), smtp
app.email.provider=${EMAIL_PROVIDER:console}

# ── AI Provider ──────────────────────────────────────────────────────────────
# Supported values: demo (default). Future: openai, gemini, etc.
ai.provider=${AI_PROVIDER:demo}

# ── Demo Mode ─────────────────────────────────────────────────────────────────
app.demo-mode=${CAREERFORGE_DEMO_MODE:false}

# ── Billing Provider ──────────────────────────────────────────────────────────
# Supported values: demo (default), stripe
app.billing.provider=${BILLING_PROVIDER:demo}

# ── Stripe (test-mode only) ───────────────────────────────────────────────────
# Required only when app.billing.provider=stripe. App starts without these.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price-pro-monthly=${STRIPE_PRICE_PRO_MONTHLY:}

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
