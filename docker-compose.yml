services:
  postgres:
    image: postgres:16-alpine
    container_name: careerforge-postgres
    environment:
      POSTGRES_DB: careerforge
      POSTGRES_USER: careerforge
      POSTGRES_PASSWORD: careerforge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerforge"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
