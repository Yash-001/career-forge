name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careerforge
          POSTGRES_USER: careerforge
          POSTGRES_PASSWORD: careerforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/careerforge
          DATABASE_USERNAME: careerforge
          DATABASE_PASSWORD: careerforge
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/

  # ── Backend production JAR ───────────────────────────────────────────────────
  backend-build:
    name: Backend Production Build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Build bootJar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Tests, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:unit -- --run

      - name: Lint
        working-directory: frontend
        run: npm run lint:oxlint

      - name: Production build
        working-directory: frontend
        run: npm run build-only

  # ── Docker build validation ──────────────────────────────────────────────────
  docker-validate:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-build, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose configs
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
